# Publishes the product image to the GitHub Container Registry as
# ghcr.io/captainepix/dccatlas, for unRAID and for anyone who would rather
# pull than build. Only a version tag (v1.2.3) publishes, as :1.2.3 and
# :latest, so an image is published only from a commit that was tagged after
# its tests passed; a manual run publishes the branch as :edge. A package created this way takes the repository's visibility.
# Action pins are the commit SHAs GitHub's own example uses:
# https://docs.github.com/en/packages/managing-github-packages-using-github-actions-workflows/publishing-and-installing-a-package-with-github-actions
name: Image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  image:
    # Only this repository publishes. A fork or other copy holds this
    # workflow too, and would otherwise try to publish over the same :latest.
    if: github.repository == 'CaptainEpix/DCCAtlas'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        id: meta
        uses: docker/metadata-action@8e671d84a3bd81afdfc4fdbb96a42b07c2a80934
        with:
          # Lower case, as a registry requires, and as the Unraid template names it.
          images: ghcr.io/captainepix/dccatlas
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
