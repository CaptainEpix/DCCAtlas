# Proposes updates as pull requests, each tested by the Tests workflow:
# the base image (Irssi on Debian, which parses what IRC servers and file
# servers send), the Python packages the web service and the browser checks
# install, and the actions the workflows use. Nothing is merged by itself.
# Once a month, each kind in one pull request, so there are at most four.
# The browser checks' packages skip major versions: Playwright decides which
# of its own dependencies it works with (pyee 16 broke it, 2026-11-03).
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
  - package-ecosystem: pip
    directory: /deploy
    schedule:
      interval: monthly
    groups:
      web-service:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tools/browser
    schedule:
      interval: monthly
    groups:
      browser-checks:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
